# Merges every push on the `audits` branch into `main`.
# The morning audit routine may only push to `audits`; Hostinger keeps deploying `main`.
name: Audits to main

on:
  push:
    branches:
      - audits

permissions:
  contents: write

concurrency:
  group: audits-to-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure bot identity
        run: |
          git config user.name "audits-bot"
          git config user.email "audits-bot@users.noreply.github.com"

      - name: Merge audits into main
        run: |
          git fetch origin audits
          git merge --no-edit origin/audits

      - name: Push main
        run: git push origin main
